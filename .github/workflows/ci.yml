name: CI
# Runs on every pull request: quality gate, then a Firebase preview deploy
# to the testbed site with the preview URL commented on the PR.
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint:error
      - run: pnpm run stylelint:error
      - run: pnpm run secretlint
      - run: pnpm test

  preview:
    name: Firebase preview (testbed)
    needs: checks
    # Skip for PRs from forks — they can't access the service-account secret.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ABOUTME_SUSHANT }}
          projectId: aboutme-sushant
          target: testbed
